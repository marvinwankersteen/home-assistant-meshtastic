# The contents of this file is based on https://github.com/home-assistant/core/blob/dev/pyproject.toml

target-version = "py312"
line-length = 120

exclude = ["custom_components/meshtastic/aiomeshtastic/protobuf"]

[lint]
select = [
    "ALL",
]

ignore = [
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
    "D203", # no-blank-line-before-class (incompatible with formatter)
    "D212", # multi-line-summary-first-line (incompatible with formatter)
    "COM812", # incompatible with formatter
    "ISC001", # incompatible with formatter
    "D100", # Missing docstring (currently no distributed library)
    "D101", # Missing docstring (currently no distributed library)
    "D102", # Missing docstring (currently no distributed library)
    "D103", # Missing docstring (currently no distributed library)
    "D104", # Missing docstring (currently no distributed library)
    "D105", # Missing docstring (currently no distributed library)
    "D107", # Missing docstring (currently no distributed library)
]

[lint.flake8-pytest-style]
fixture-parentheses = false

[lint.pyupgrade]
keep-runtime-typing = true

[lint.mccabe]
max-complexity = 25

[lint.per-file-ignores]
"tests/*" = [
    "ANN001", # Fixture and parametrized argument types are inferred by pytest.
    "ANN201", # Test and fixture return types are not required.
    "ANN202", # Nested test callback return types are not required.
    "ARG001", # Some fixtures are requested for their side effects.
    "ARG005", # Mock callbacks preserve the signature of the replaced function.
    "PLR0913", # Test dependencies are passed as fixtures.
    "PLR2004", # Test expectations include explicit numeric values.
    "S101", # Assertions are the pytest assertion API.
    "SLF001", # Regression tests exercise integration helper methods.
]
